[workspace]
members = ["crates/arany", "crates/arany-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "A durable, CLI-only agent harness"
repository = "https://github.com/fpmirabile/arany"

[workspace.dependencies]
async-trait = "=0.1.92"
aws-lc-rs = { version = "=1.18.1", default-features = false }
base64 = { version = "=0.23.1", default-features = false, features = ["alloc"] }
cap-fs-ext = { version = "4.0.3", default-features = false, features = ["std"] }
cap-std = { version = "4.0.3", default-features = false }
cc = "=1.5.1"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "=0.29.0", default-features = false, features = [
  "events",
] }
directories = "6.0.0"
getrandom = { version = "=0.4.3", default-features = false }
globset = "=0.4.20"
ignore = { version = "=0.4.33", default-features = false }
keyring = { version = "=4.2.0", default-features = false, features = ["v1"] }
opentelemetry = { version = "=0.33.1", default-features = false, features = [
  "trace",
] }
opentelemetry-http = { version = "=0.33.0", default-features = false, features = [
  "reqwest",
] }
opentelemetry_sdk = { version = "=0.33.0", default-features = false, features = [
  "trace",
] }
opentelemetry-otlp = { version = "=0.33.0", default-features = false, features = [
  "trace",
  "http-proto",
  "reqwest-client",
] }
ratatui = { version = "=0.30.2", default-features = false, features = [
  "crossterm",
  "scrolling-regions",
] }
regex = "=1.13.1"
rusqlite = { version = "0.40.2", default-features = false, features = [
  "bundled",
  "limits",
] }
reqwest = { version = "0.13.5", default-features = false, features = [
  "rustls",
] }
schemars = { version = "=1.2.2", default-features = false, features = [
  "derive",
  "std",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = { version = "0.11", default-features = false }
thiserror = "2.0.21"
tokio = { version = "1.53.1", default-features = false, features = [
  "rt",
  "sync",
  "time",
  "macros",
  "signal",
  "net",
  "io-util",
  "process",
  "fs",
] }
jsonschema = { version = "=0.58.6", default-features = false }
yaml_serde = { version = "=0.10.7", default-features = false, features = [
  "std",
] }
unicode-segmentation = "1.13.3"
unicode-width = "=0.2.2"
url = { version = "=2.5.8", default-features = false }
uuid = { version = "1.26.1", features = ["serde", "v7"] }
mio = { version = "1.2.3", default-features = false, features = [
  "os-ext",
  "os-poll",
] }
rustix = { version = "1.1.5", default-features = false, features = [
  "std",
  "event",
  "fs",
  "process",
  "termios",
  "time",
] }
nix = { version = "=0.31.3", default-features = false, features = ["user"] }
seccompiler = { version = "=0.5.0", default-features = false }
core-foundation = { version = "=0.10.1", default-features = false, features = [
  "link",
] }
security-framework = "=3.7.0"
opentelemetry-proto = { version = "=0.33.0", default-features = false, features = [
  "trace",
  "gen-tonic-messages",
] }
prost = "=0.14.4"
tempfile = "3.27.0"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(arany_ci)',
  'cfg(arany_guard)',
] }
