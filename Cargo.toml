[package]
name = "arany"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "A durable, CLI-only agent harness"
repository = "https://github.com/fpmirabile/arany"
include = ["src/**", "tests/**", "scripts/**", "Cargo.toml", "Cargo.lock", "/LICENSE", "/NOTICE"]

[dependencies]
async-trait = "=0.1.92"
aws-lc-rs = { version = "=1.18.1", default-features = false }
base64 = { version = "=0.23.1", default-features = false, features = ["alloc"] }
cap-fs-ext = { version = "4.0.3", default-features = false, features = ["std"] }
cap-std = { version = "4.0.3", default-features = false }
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "=0.29.0", default-features = false, features = ["events"] }
directories = "6.0.0"
getrandom = { version = "=0.4.3", default-features = false }
keyring = { version = "=4.2.0", default-features = false, features = ["v1"] }
opentelemetry = { version = "=0.33.0", default-features = false, features = ["trace"] }
opentelemetry-http = { version = "=0.33.0", default-features = false, features = ["reqwest"] }
opentelemetry_sdk = { version = "=0.33.0", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "=0.33.0", default-features = false, features = ["trace", "http-proto", "reqwest-client"] }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm", "scrolling-regions"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = { version = "0.11", default-features = false }
thiserror = "2.0.21"
tokio = { version = "1.53.1", default-features = false, features = ["rt", "sync", "time", "macros", "signal", "net", "io-util", "process"] }
jsonschema = { version = "=0.56.0", default-features = false }
yaml_serde = { version = "=0.10.7", default-features = false, features = ["std"] }
unicode-segmentation = "1.13.3"
unicode-width = "=0.2.0"
url = { version = "=2.5.8", default-features = false }
uuid = { version = "1.26.1", features = ["serde", "v7"] }

[target.'cfg(unix)'.dependencies]
mio = { version = "1.2.3", default-features = false, features = ["os-ext", "os-poll"] }
rustix = { version = "1.1.5", default-features = false, features = ["std", "fs", "process", "termios"] }

[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = { version = "=0.5.0", default-features = false }
nix = { version = "=0.29.0", default-features = false, features = ["user"] }

[dev-dependencies]
opentelemetry-proto = { version = "=0.33.0", default-features = false, features = ["trace", "gen-tonic-messages"] }
opentelemetry_sdk = { version = "=0.33.0", default-features = false, features = ["trace", "testing"] }
prost = "=0.14.4"
tempfile = "3.27.0"
tokio = { version = "1.53.1", default-features = false, features = ["test-util", "io-util"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { version = "1.1.5", default-features = false, features = ["pipe", "pty"] }
