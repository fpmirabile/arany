name: Run CI tests
description: Run the full release suite or debug unit and Session coverage on a native runner.
inputs:
  profile:
    description: debug or release
    required: true
runs:
  using: composite
  steps:
    - name: Configure test profile
      shell: bash
      env:
        CI_PROFILE: ${{ inputs.profile }}
      run: |
        case "$CI_PROFILE" in
          debug|release) ;;
          *) echo 'Unsupported test profile' >&2; exit 1 ;;
        esac
        if [ "$RUNNER_OS" = macOS ]; then
          echo 'TMPDIR=/private/tmp' >> "$GITHUB_ENV"
          echo "ARANY_TEST_EXE=$GITHUB_WORKSPACE/target/$CI_PROFILE/arany" >> "$GITHUB_ENV"
        fi
    - name: Install repository Rust toolchain
      shell: bash
      run: rustup show
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        shared-key: native-tests-${{ inputs.profile }}
    - name: Prepare isolated Linux terminal fixtures
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes bubblewrap iproute2 util-linux
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        test -x /usr/sbin/ip
        bwrap --unshare-user --unshare-net --ro-bind / / -- true
    - name: Fetch locked Rust dependencies
      shell: bash
      run: cargo fetch --locked
    - name: Check production release targets
      if: inputs.profile == 'debug'
      shell: bash
      run: cargo clippy --workspace --lib --bins --release --locked --offline -- -D warnings
    - name: Check ordinary release targets with all features
      if: runner.os == 'Linux' && inputs.profile == 'debug'
      shell: bash
      env:
        # Clear arany_ci only here to compile the ordinary release test alternatives.
        RUSTFLAGS: '-D warnings'
      run: cargo check --workspace --all-targets --all-features --release --locked --offline
    - name: Reject product unwraps
      if: inputs.profile == 'debug'
      shell: bash
      run: cargo clippy --workspace --lib --bins --locked --offline -- -D warnings -D clippy::unwrap_used
    - name: Clippy on macOS
      if: runner.os == 'macOS' && inputs.profile == 'debug'
      shell: bash
      run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
    - name: Run debug unit and Session tests
      if: inputs.profile == 'debug'
      shell: bash
      run: cargo test --workspace --lib --bins --test session_run --locked --offline
    - name: Run full release suite
      if: inputs.profile == 'release'
      shell: bash
      run: cargo test --workspace --release --locked --offline
    - name: Run explicit macOS offline Rust build gate
      if: runner.os == 'macOS' && inputs.profile == 'debug'
      shell: bash
      run: |
          set -euo pipefail
          ARANY_TEST_RUST_SYSROOT="$(rustc --print sysroot)"
          ARANY_TEST_RUST_SYSROOT="$(python3 -c 'import pathlib, sys; print(pathlib.Path(sys.argv[1]).resolve(strict=True))' "$ARANY_TEST_RUST_SYSROOT")"
          export ARANY_TEST_RUST_SYSROOT
          cargo test --locked --offline -p arany-cli --test session_run tools::guarded_offline_rust_build_uses_selected_runtime_and_sdk -- --exact --ignored --nocapture 2>&1 | python3 -c '
          import re
          import sys

          limit = 1024 * 1024
          captured = bytearray()
          for chunk in iter(lambda: sys.stdin.buffer.read(65536), b""):
              remaining = limit + 1 - len(captured)
              if remaining > 0:
                  captured.extend(chunk[:remaining])
          sys.stdout.buffer.write(captured[:limit])
          if len(captured) > limit:
              raise SystemExit("native gate output exceeded 1 MiB")
          summary = rb"test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out"
          if len(re.findall(summary, captured)) != 1:
              raise SystemExit("native gate must complete exactly one passing test")
          '
    - name: Run explicit macOS APFS rewind alias gate
      if: runner.os == 'macOS' && inputs.profile == 'release'
      shell: bash
      run: |
          set -euo pipefail
          cargo test --locked --offline --release -p arany-cli --test guard_runs rewind::guarded_rewind_refuses_case_insensitive_apfs_alias_without_publication -- --exact --ignored --nocapture 2>&1 | python3 -c '
          import re
          import sys

          limit = 1024 * 1024
          captured = bytearray()
          for chunk in iter(lambda: sys.stdin.buffer.read(65536), b""):
              remaining = limit + 1 - len(captured)
              if remaining > 0:
                  captured.extend(chunk[:remaining])
          sys.stdout.buffer.write(captured[:limit])
          if len(captured) > limit:
              raise SystemExit("native gate output exceeded 1 MiB")
          summary = rb"test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out"
          if len(re.findall(summary, captured)) != 1:
              raise SystemExit("native gate must complete exactly one passing test")
          '
