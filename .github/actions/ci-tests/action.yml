name: Run CI tests
description: Run the unified release suite and native gates on a native runner.
runs:
  using: composite
  steps:
    - name: Configure release fixtures
      shell: bash
      run: |
        if [ "$RUNNER_OS" = macOS ]; then
          echo 'TMPDIR=/private/tmp' >> "$GITHUB_ENV"
        fi
        echo "ARANY_TEST_EXE=$GITHUB_WORKSPACE/target/release/arany" >> "$GITHUB_ENV"
    - name: Install repository Rust toolchain
      shell: bash
      run: rustup show
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        shared-key: native-tests-release-fixtures
    - name: Prepare isolated Linux terminal fixtures
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes bubblewrap iproute2 util-linux
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        test -x /usr/sbin/ip
        bwrap --unshare-user --unshare-net --ro-bind / / -- true
    - name: Fetch locked Rust dependencies
      shell: bash
      run: cargo fetch --locked
    - name: Check production release targets
      shell: bash
      run: cargo clippy --workspace --lib --bins --release --locked --offline -- -D warnings -D clippy::unwrap_used
    - name: Check release targets with all features
      if: runner.os == 'Linux'
      shell: bash
      env:
        # Clear arany_ci only here to compile the ordinary release test alternatives.
        RUSTFLAGS: '-D warnings'
      run: cargo check --workspace --all-targets --all-features --release --locked --offline
    - name: Clippy on macOS
      if: runner.os == 'macOS'
      shell: bash
      run: cargo clippy --workspace --all-targets --release --features arany-cli/test-support --locked --offline -- -D warnings
    - name: Pin ordinary production release
      shell: bash
      run: |
        cargo build --release --locked --offline -p arany-cli --bin arany
        cp target/release/arany "$RUNNER_TEMP/arany-production-release"
        echo "ARANY_PRODUCTION_EXE=$RUNNER_TEMP/arany-production-release" >> "$GITHUB_ENV"
    - name: Run full release suite
      shell: bash
      run: cargo test --workspace --release --features arany-cli/test-support --locked --offline --no-fail-fast
    - name: Run explicit native release gates
      shell: bash
      run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = macOS ]; then
            gate=tools::guarded_offline_rust_build_uses_selected_runtime_and_sdk
          else
            gate=tools::native_exec::guarded_offline_cargo_tests_use_selected_runtime_and_registry
          fi
          ARANY_TEST_RUST_SYSROOT="$(rustc --print sysroot)"
          ARANY_TEST_RUST_SYSROOT="$(python3 -c 'import pathlib, sys; print(pathlib.Path(sys.argv[1]).resolve(strict=True))' "$ARANY_TEST_RUST_SYSROOT")"
          export ARANY_TEST_RUST_SYSROOT
          run_gate() {
          cargo test --release --features arany-cli/test-support --locked --offline -p arany-cli --test "$1" "$2" -- --exact --ignored --nocapture 2>&1 | python3 -c '
          import re
          import sys

          limit = 1024 * 1024
          captured = bytearray()
          for chunk in iter(lambda: sys.stdin.buffer.read(65536), b""):
              remaining = limit + 1 - len(captured)
              if remaining > 0:
                  captured.extend(chunk[:remaining])
          sys.stdout.buffer.write(captured[:limit])
          if len(captured) > limit:
              raise SystemExit("native gate output exceeded 1 MiB")
          summary = rb"test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out"
          if len(re.findall(summary, captured)) != 1:
              raise SystemExit("native gate must complete exactly one passing test")
          '
          }
          run_gate production_release ordinary_release_refuses_the_account_fixture_before_reading_state
          run_gate session_run "$gate"
          if [ "$RUNNER_OS" = macOS ]; then
            run_gate guard_runs rewind::guarded_rewind_refuses_case_insensitive_apfs_alias_without_publication
          fi
