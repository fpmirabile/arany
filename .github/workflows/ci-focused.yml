name: Focused CI lane

# Uses the same test action as ci.yml. Job names must never match required checks.
on:
  workflow_dispatch:
    inputs:
      lane:
        description: Diagnostic lane; never satisfies required checks.
        type: choice
        required: true
        options:
          - linux-tests
          - macos-tests

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.lane }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: --cfg arany_ci

jobs:
  linux:
    name: Focused Linux Tests
    if: startsWith(inputs.lane, 'linux-')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-tests

  macos:
    name: Focused macOS Tests
    if: startsWith(inputs.lane, 'macos-')
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-tests
