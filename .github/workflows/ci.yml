name: CI

on:
  # Every pull request, including stacked ones whose base is another branch.
  # The merge ref tests the head merged into its base, so a stacked head is checked as a whole.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      history_benchmark:
        description: Run the ignored native Linux long-history release measurement
        required: false
        default: false
        type: boolean
      linux_arm64:
        description: Run native Linux ARM64 debug and release tests
        required: false
        default: false
        type: boolean
      linux_native_advanced:
        description: Run native Linux release Guard and tmux gates on x86_64 and ARM64
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Enables the native gates marked `cfg_attr(not(arany_ci), ignore)`; one fingerprint for every job.
  RUSTFLAGS: --cfg arany_ci

jobs:
  hygiene:
    name: Linux hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_MACHETE_VERSION: 0.9.1
      TYPOS_VERSION: 1.35.8
      TAPLO_VERSION: 0.10.0
      CARGO_TERM_COLOR: never
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install repository Rust toolchain
        run: rustup show
      - name: Install pinned tools and check hygiene
        shell: bash
        run: |
          set -euo pipefail

          work="$(mktemp -d "$RUNNER_TEMP/hygiene.XXXXXX")"
          output_limit=65536

          run_bounded() {
            local seconds="$1" label="$2"
            shift 2
            local -a statuses
            set +e
            timeout --signal=TERM --kill-after=10s "${seconds}s" "$@" 2>&1 |
              head -c "$((output_limit + 1))" | tee "$work/$label.log"
            statuses=("${PIPESTATUS[@]}")
            set -e
            if (( $(stat -c %s "$work/$label.log") > output_limit )); then
              printf '\nhygiene: %s output exceeded %s bytes\n' "$label" "$output_limit" >&2
              return 125
            fi
            for status in "${statuses[@]}"; do
              (( status == 0 )) || return "$status"
            done
          }

          run_bounded 540 install-machete cargo install --quiet --locked --version "$CARGO_MACHETE_VERSION" cargo-machete
          run_bounded 540 install-typos cargo install --quiet --locked --version "$TYPOS_VERSION" typos-cli
          run_bounded 540 install-taplo cargo install --quiet --locked --version "$TAPLO_VERSION" taplo-cli
          run_bounded 30 machete-version cargo machete --version
          run_bounded 30 typos-version typos --version
          run_bounded 30 taplo-version taplo --version
          if [[ "$(< "$work/machete-version.log")" != "$CARGO_MACHETE_VERSION" ||
                "$(< "$work/typos-version.log")" != "typos-cli $TYPOS_VERSION" ||
                "$(< "$work/taplo-version.log")" != "taplo $TAPLO_VERSION" ]]; then
            printf 'hygiene: installed tool versions do not match the pins\n' >&2
            exit 1
          fi
          run_bounded 120 machete cargo machete
          run_bounded 120 typos typos
          run_bounded 120 taplo taplo fmt --check

  changes:
    name: Detect code changes
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      code-changed: ${{ steps.diff.outputs.code-changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify code change detection
        run: python3 scripts/test-ci-changes.py
      - id: diff
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BEFORE: ${{ github.event.before }}
        run: python3 scripts/ci-changes.py

  format-and-clippy:
    name: Clippy
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code-changed != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install repository Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo fetch --locked
      - name: Check library dependency boundary
        run: |
          cargo tree -p arany -e normal --target all --locked --offline > "$RUNNER_TEMP/arany-library-tree.txt"
          if grep -E 'ratatui|crossterm|keyring' "$RUNNER_TEMP/arany-library-tree.txt"; then
            exit 1
          fi
      - run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings

  linux-debug:
    name: Linux Tests (debug)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code-changed != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-tests
        with:
          profile: debug

  linux-release:
    name: Linux Tests (release)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code-changed != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-tests
        with:
          profile: release
      - name: Measure native long-history behavior
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.history_benchmark }}
        shell: bash
        run: |
          sudo apt-get install --yes tmux
          cargo test --locked --offline --release -p arany-cli --test session_run active_terminal::tmux::history_latency::active_keyboard_stays_visible_with_near_cap_history -- --exact --ignored --nocapture | tee "$RUNNER_TEMP/arany-history-measurement.log"
          python3 - <<'PY'
          import os
          import pathlib
          import re

          output = (pathlib.Path(os.environ["RUNNER_TEMP"]) / "arany-history-measurement.log").read_text()
          if not re.search(r"test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; \d+ filtered out", output):
              raise SystemExit("The history measurement must complete exactly one test")
          PY

  linux-arm64-tests:
    name: Linux ARM64 Tests (${{ matrix.profile }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.linux_arm64 }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [debug, release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install repository Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: linux-arm64-${{ matrix.profile }}
      - name: Verify native Linux ARM64 host and Rust target
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(rustc -vV | sed -n 's/^host: //p')" = aarch64-unknown-linux-gnu
      - name: Prepare isolated Linux terminal fixtures
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap iproute2 util-linux
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          test -x /usr/sbin/ip
          bwrap --unshare-user --unshare-net --ro-bind / / -- true
      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked
      - name: Run workspace tests (${{ matrix.profile }})
        run: cargo test --workspace --locked --offline ${{ matrix.profile == 'release' && '--release' || '' }}

  linux-native-advanced:
    name: Native Linux Guard and tmux (${{ matrix.arch }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.linux_native_advanced }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            machine: x86_64
            host: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            arch: arm64
            machine: aarch64
            host: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install repository Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: native-advanced-${{ matrix.arch }}-release
      - name: Verify native Linux host and Rust target
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.machine }}"
          test "$(rustc -vV | sed -n 's/^host: //p')" = "${{ matrix.host }}"
      - name: Prepare native Guard and tmux prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes bubblewrap iproute2 tmux util-linux
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          test -x /usr/bin/tmux
          test -x /usr/sbin/ip
          bwrap --unshare-user --unshare-net --ro-bind / / -- true
      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked
      - name: Run exact native release parents
        run: |
          set -euo pipefail
          log="$(mktemp)"
          trap 'rm -f "$log"' EXIT

          run_exact_parent() {
            local parent="$1"
            if ! cargo test --release --locked --offline -p arany-cli --test session_run "$parent" -- --ignored --exact 2>&1 | python3 -c '
          import sys

          limit = int(sys.argv[2])
          captured = 0
          with open(sys.argv[1], "wb") as output:
              while chunk := sys.stdin.buffer.read(65536):
                  remaining = limit + 1 - captured
                  if remaining > 0:
                      kept = chunk[:remaining]
                      output.write(kept)
                      captured += len(kept)

          if captured > limit:
              print("native parent output exceeded the 1 MiB capture limit", file=sys.stderr)
              sys.exit(1)
          ' "$log" 1048576; then
              cat "$log"
              return 1
            fi
            cat "$log"
            test "$(grep -Fxc 'running 1 test' "$log" || true)" = 1 || return 1
            test "$(grep -Fxc "test $parent ... ok" "$log" || true)" = 1 || return 1
            grep -Fq 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$log" || return 1
          }

          result=0
          run_exact_parent tools::native_exec::shipped_exec_continues_after_guarded_command_and_replays_closed_events || result=1
          run_exact_parent active_terminal::tmux::inline_composer_restores_tmux_pane_and_replays_empty_session || result=1
          run_exact_parent active_terminal::tmux::active_shelf_stays_above_retained_draft_in_tmux || result=1
          run_exact_parent active_terminal::tmux::classic_steering_note_and_pause_in_tmux || result=1
          run_exact_parent active_terminal::tmux::fullscreen_steering_note_and_pause_in_tmux || result=1
          exit "$result"

  macos-debug:
    name: macOS Tests (debug)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code-changed != 'false' }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-tests
        with:
          profile: debug

  macos-release:
    name: macOS Tests (release)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code-changed != 'false' }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-tests
        with:
          profile: release
