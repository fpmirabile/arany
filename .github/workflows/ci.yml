name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_policy:
        description: Run the fresh dependency release-policy gate
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Enables the native gates marked `cfg_attr(not(arany_ci), ignore)`; one fingerprint for every job.
  RUSTFLAGS: --cfg arany_ci

jobs:
  changes:
    name: Detect Markdown-only PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      markdown-only: ${{ steps.diff.outputs.markdown-only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: diff
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          paths = subprocess.check_output([
              "git", "diff", "--no-renames", "--name-only", "-z", "HEAD^1", "HEAD",
          ]).split(b"\0")[:-1]
          markdown_only = bool(paths) and all(path.endswith(b".md") for path in paths)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"markdown-only={str(markdown_only).lower()}\n")
          PY

  format-and-clippy:
    name: Linux Format and Clippy
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - if: needs.changes.outputs.markdown-only != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install repository Rust toolchain
        if: needs.changes.outputs.markdown-only != 'true'
        run: rustup show
      - if: needs.changes.outputs.markdown-only != 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - if: needs.changes.outputs.markdown-only != 'true'
        run: cargo fmt --all --check
      - if: needs.changes.outputs.markdown-only != 'true'
        run: cargo fetch --locked
      - if: needs.changes.outputs.markdown-only != 'true'
        run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings

  tests:
    name: Linux Tests (${{ matrix.profile }})
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [debug, release]
    steps:
      - if: needs.changes.outputs.markdown-only != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install repository Rust toolchain
        if: needs.changes.outputs.markdown-only != 'true'
        run: rustup show
      - if: needs.changes.outputs.markdown-only != 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.profile }}
      - name: Prepare isolated Linux terminal fixtures
        if: needs.changes.outputs.markdown-only != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap util-linux
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-user --unshare-net --ro-bind / / -- true
      - if: needs.changes.outputs.markdown-only != 'true'
        run: cargo fetch --locked
      - if: needs.changes.outputs.markdown-only != 'true'
        run: cargo test --workspace --locked --offline ${{ matrix.profile == 'release' && '--release' || '' }}

  macos-tests:
    name: macOS tests (${{ matrix.profile }})
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: macos-15
    timeout-minutes: 30
    env:
      TMPDIR: /private/tmp
      ARANY_TEST_EXE: ${{ github.workspace }}/target/${{ matrix.profile }}/arany
    strategy:
      fail-fast: false
      matrix:
        profile: [debug, release]
    steps:
      - if: needs.changes.outputs.markdown-only != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install repository Rust toolchain
        if: needs.changes.outputs.markdown-only != 'true'
        run: rustup show
      - if: needs.changes.outputs.markdown-only != 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.profile }}
      - if: needs.changes.outputs.markdown-only != 'true'
        run: cargo fetch --locked
      - name: Clippy on macOS
        if: matrix.profile == 'debug' && needs.changes.outputs.markdown-only != 'true'
        run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - if: needs.changes.outputs.markdown-only != 'true'
        run: cargo test --workspace --locked --offline ${{ matrix.profile == 'release' && '--release' || '' }}

  release-policy:
    name: Fresh release policy (opt-in)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_policy }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      RUSTFLAGS: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install repository Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install pinned scanners and check fresh policy
        shell: bash
        env:
          ARANY_AUDIT_DB_PATH: ${{ runner.temp }}/arany-release-policy-audit-db
          ARANY_DENY_DB_PATH: ${{ runner.temp }}/arany-release-policy-deny-db
          ARANY_POLICY_TMP: ${{ runner.temp }}/arany-release-policy-work
        run: |
          set -euo pipefail

          for path in "$ARANY_AUDIT_DB_PATH" "$ARANY_DENY_DB_PATH" "$ARANY_POLICY_TMP"; do
            if [[ -e "$path" || -L "$path" ]]; then
              printf 'release-policy: expected a fresh path: %s\n' "$path" >&2
              exit 1
            fi
          done
          mkdir -m 700 "$ARANY_POLICY_TMP"
          cleanup() {
            rm -rf -- "$ARANY_AUDIT_DB_PATH" "$ARANY_DENY_DB_PATH" "$ARANY_POLICY_TMP"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          run_bounded() {
            local seconds="$1"
            local label="$2"
            shift 2
            local log_path="$ARANY_POLICY_TMP/$label.log"
            local -a statuses

            set +e
            timeout --signal=TERM --kill-after=10s "${seconds}s" "$@" 2>&1 |
              python3 -c '
          import os
          import pathlib
          import sys

          limit = 65536
          captured = bytearray()
          overflow = False
          while True:
              chunk = os.read(sys.stdin.fileno(), 8192)
              if not chunk:
                  break
              remaining = limit - len(captured)
              if remaining > 0:
                  visible = chunk[:remaining]
                  captured.extend(visible)
                  sys.stdout.buffer.write(visible)
                  sys.stdout.buffer.flush()
              if len(chunk) > remaining:
                  overflow = True
          if overflow:
              print("release-policy: command output exceeded 65536 bytes", file=sys.stderr)
              raise SystemExit(125)
          pathlib.Path(sys.argv[1]).write_bytes(captured)
          ' "$log_path"
            statuses=( "${PIPESTATUS[@]}" )
            set -e
            if (( statuses[0] != 0 )); then
              return "${statuses[0]}"
            fi
            if (( statuses[1] != 0 )); then
              return "${statuses[1]}"
            fi
          }

          run_bounded 540 install-audit cargo install --locked --version 0.22.2 cargo-audit
          run_bounded 540 install-deny cargo install --locked --version 0.20.2 cargo-deny
          run_bounded 30 audit-version cargo audit --version
          run_bounded 30 deny-version cargo deny --version
          grep -Fq '0.22.2' "$ARANY_POLICY_TMP/audit-version.log"
          grep -Fq '0.20.2' "$ARANY_POLICY_TMP/deny-version.log"
          run_bounded 180 locked-fetch cargo fetch --locked --quiet

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          source = Path("deny.toml").read_text()
          db_path = os.environ["ARANY_DENY_DB_PATH"]
          if not Path(db_path).is_absolute() or any(c in db_path for c in "\"\\\n\r"):
              raise SystemExit("release-policy: invalid private database path")
          if re.search(r"(?m)^\s*db-path\s*=|^\s*db-urls\s*=", source):
              raise SystemExit("release-policy: repository deny.toml already sets advisory database overrides")
          updated, count = re.subn(
              r"(?m)^\[advisories\]\s*$",
              f'[advisories]\ndb-path = "{db_path}"\ndb-urls = ["https://github.com/RustSec/advisory-db"]',
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit("release-policy: expected one advisories section")
          (Path(os.environ["ARANY_POLICY_TMP"]) / "deny.toml").write_text(updated)
          PY

          run_bounded 300 audit-scan cargo audit -D warnings --db "$ARANY_AUDIT_DB_PATH" --url https://github.com/RustSec/advisory-db
          run_bounded 300 deny-fetch cargo deny --config "$ARANY_POLICY_TMP/deny.toml" fetch db
          run_bounded 300 deny-check cargo deny --config "$ARANY_POLICY_TMP/deny.toml" --locked --offline check
          run_bounded 30 audit-revision git -C "$ARANY_AUDIT_DB_PATH" rev-parse --verify HEAD
          run_bounded 30 deny-markers find "$ARANY_DENY_DB_PATH" -mindepth 1 -maxdepth 3 -name .git -print

          mapfile -t deny_git_markers < "$ARANY_POLICY_TMP/deny-markers.log"
          if (( ${#deny_git_markers[@]} != 1 )); then
            printf 'release-policy: expected one fetched cargo-deny advisory repository\n' >&2
            exit 1
          fi
          deny_repo="${deny_git_markers[0]%/.git}"
          run_bounded 30 deny-revision git -C "$deny_repo" rev-parse --verify HEAD

          advisory_count="$(timeout --signal=TERM --kill-after=5s 30s git -C "$ARANY_AUDIT_DB_PATH" ls-files -z -- 'crates/**/RUSTSEC-*.md' | python3 -c '
          import sys

          count = 0
          while True:
              chunk = sys.stdin.buffer.read(65536)
              if not chunk:
                  break
              count += chunk.count(b"\0")
          print(count)
          ')"
          if [[ ! "$advisory_count" =~ ^[1-9][0-9]*$ ]]; then
            printf 'release-policy: fresh RustSec advisory count was empty or invalid\n' >&2
            exit 1
          fi
          locked_packages="$(python3 -c 'import tomllib; print(len(tomllib.load(open("Cargo.lock", "rb"))["package"]))')"
          checked_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          audit_revision="$(< "$ARANY_POLICY_TMP/audit-revision.log")"
          deny_revision="$(< "$ARANY_POLICY_TMP/deny-revision.log")"
          {
            printf '### Fresh dependency release-policy gate\n\n'
            printf -- '- Result: strict audit and selected-target deny checks passed.\n'
            printf -- '- UTC check time: `%s`\n' "$checked_at"
            printf -- '- Locked package count: `%s`\n' "$locked_packages"
            printf -- '- Tracked RustSec advisory records: `%s`\n' "$advisory_count"
            printf -- '- Private cargo-audit DB revision: `%s`\n' "$audit_revision"
            printf -- '- Private cargo-deny DB revision: `%s`\n' "$deny_revision"
            printf -- '- Tools: `cargo-audit 0.22.2`, `cargo-deny 0.20.2`\n'
          } >> "$GITHUB_STEP_SUMMARY"
