name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      lane:
        description: Select one diagnostic lane; automatic runs always use the full matrix.
        type: choice
        required: true
        default: full
        options:
          - full
          - linux-debug
          - linux-release
          - macos-debug
          - macos-release

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Enables the native gates marked `cfg_attr(not(arany_ci), ignore)`; one fingerprint for every job.
  RUSTFLAGS: --cfg arany_ci

jobs:
  select-lanes:
    name: Select CI lanes
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      run-lint: ${{ steps.select.outputs.run-lint }}
      run-linux: ${{ steps.select.outputs.run-linux }}
      linux-profiles: ${{ steps.select.outputs.linux-profiles }}
      run-macos: ${{ steps.select.outputs.run-macos }}
      macos-profiles: ${{ steps.select.outputs.macos-profiles }}
    steps:
      - id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          SELECTED_LANE: ${{ inputs.lane }}
        run: |
          case "$EVENT_NAME:$SELECTED_LANE" in
            pull_request:*|push:*|workflow_dispatch:full)
              run_lint=true
              run_linux=true
              linux_profiles='["debug","release"]'
              run_macos=true
              macos_profiles='["debug","release"]'
              ;;
            workflow_dispatch:linux-debug)
              run_lint=false
              run_linux=true
              linux_profiles='["debug"]'
              run_macos=false
              macos_profiles='[]'
              ;;
            workflow_dispatch:linux-release)
              run_lint=false
              run_linux=true
              linux_profiles='["release"]'
              run_macos=false
              macos_profiles='[]'
              ;;
            workflow_dispatch:macos-debug)
              run_lint=false
              run_linux=false
              linux_profiles='[]'
              run_macos=true
              macos_profiles='["debug"]'
              ;;
            workflow_dispatch:macos-release)
              run_lint=false
              run_linux=false
              linux_profiles='[]'
              run_macos=true
              macos_profiles='["release"]'
              ;;
            *)
              echo "Unsupported CI lane selection" >&2
              exit 2
              ;;
          esac
          {
            printf 'run-lint=%s\n' "$run_lint"
            printf 'run-linux=%s\n' "$run_linux"
            printf 'linux-profiles=%s\n' "$linux_profiles"
            printf 'run-macos=%s\n' "$run_macos"
            printf 'macos-profiles=%s\n' "$macos_profiles"
          } >> "$GITHUB_OUTPUT"

  changes:
    name: Detect Markdown-only PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      markdown-only: ${{ steps.diff.outputs.markdown-only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: diff
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          paths = subprocess.check_output([
              "git", "diff", "--no-renames", "--name-only", "-z", "HEAD^1", "HEAD",
          ]).split(b"\0")[:-1]
          markdown_only = bool(paths) and all(path.endswith(b".md") for path in paths)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"markdown-only={str(markdown_only).lower()}\n")
          PY

  format-and-clippy:
    name: Linux Format and Clippy
    needs: [changes, select-lanes]
    if: ${{ !cancelled() && needs.select-lanes.outputs.run-lint == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - if: needs.changes.outputs.markdown-only != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install repository Rust toolchain
        if: needs.changes.outputs.markdown-only != 'true'
        run: rustup show
      - if: needs.changes.outputs.markdown-only != 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - if: needs.changes.outputs.markdown-only != 'true'
        run: cargo fmt --all --check
      - if: needs.changes.outputs.markdown-only != 'true'
        run: cargo fetch --locked
      - if: needs.changes.outputs.markdown-only != 'true'
        run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings

  tests:
    name: Linux Tests (${{ matrix.profile }})
    needs: [changes, select-lanes]
    if: ${{ !cancelled() && needs.select-lanes.outputs.run-linux == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.select-lanes.outputs.linux-profiles) }}
    steps:
      - if: needs.changes.outputs.markdown-only != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install repository Rust toolchain
        if: needs.changes.outputs.markdown-only != 'true'
        run: rustup show
      - if: needs.changes.outputs.markdown-only != 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.profile }}
      - name: Prepare isolated Linux terminal fixtures
        if: needs.changes.outputs.markdown-only != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap util-linux
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-user --unshare-net --ro-bind / / -- true
      - if: needs.changes.outputs.markdown-only != 'true'
        run: cargo fetch --locked
      - if: needs.changes.outputs.markdown-only != 'true'
        run: cargo test --workspace --locked --offline ${{ matrix.profile == 'release' && '--release' || '' }}

  macos-tests:
    name: macOS tests (${{ matrix.profile }})
    needs: [changes, select-lanes]
    if: ${{ !cancelled() && needs.select-lanes.outputs.run-macos == 'true' }}
    runs-on: macos-15
    timeout-minutes: 30
    env:
      TMPDIR: /private/tmp
      ARANY_TEST_EXE: ${{ github.workspace }}/target/${{ matrix.profile }}/arany
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.select-lanes.outputs.macos-profiles) }}
    steps:
      - if: needs.changes.outputs.markdown-only != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install repository Rust toolchain
        if: needs.changes.outputs.markdown-only != 'true'
        run: rustup show
      - if: needs.changes.outputs.markdown-only != 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.profile }}
      - if: needs.changes.outputs.markdown-only != 'true'
        run: cargo fetch --locked
      - name: Clippy on macOS
        if: matrix.profile == 'debug' && needs.select-lanes.outputs.run-lint == 'true' && needs.changes.outputs.markdown-only != 'true'
        run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - if: needs.changes.outputs.markdown-only != 'true'
        run: cargo test --workspace --locked --offline ${{ matrix.profile == 'release' && '--release' || '' }}
