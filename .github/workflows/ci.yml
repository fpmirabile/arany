name: CI

on:
  # Every pull request, including stacked ones whose base is another branch.
  # The merge ref tests the head merged into its base, so a stacked head is checked as a whole.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      history_benchmark:
        description: Run the ignored native Linux long-history release measurement
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Enables the native gates marked `cfg_attr(not(arany_ci), ignore)`; one fingerprint for every job.
  RUSTFLAGS: --cfg arany_ci

jobs:
  hygiene:
    name: Linux hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_MACHETE_VERSION: 0.9.1
      TYPOS_VERSION: 1.35.8
      TAPLO_VERSION: 0.10.0
      CARGO_TERM_COLOR: never
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install repository Rust toolchain
        run: rustup show
      - name: Install pinned tools and check hygiene
        shell: bash
        run: |
          set -euo pipefail

          work="$(mktemp -d "$RUNNER_TEMP/hygiene.XXXXXX")"
          output_limit=65536

          run_bounded() {
            local seconds="$1" label="$2"
            shift 2
            local -a statuses
            set +e
            timeout --signal=TERM --kill-after=10s "${seconds}s" "$@" 2>&1 |
              head -c "$((output_limit + 1))" | tee "$work/$label.log"
            statuses=("${PIPESTATUS[@]}")
            set -e
            if (( $(stat -c %s "$work/$label.log") > output_limit )); then
              printf '\nhygiene: %s output exceeded %s bytes\n' "$label" "$output_limit" >&2
              return 125
            fi
            for status in "${statuses[@]}"; do
              (( status == 0 )) || return "$status"
            done
          }

          run_bounded 540 install-machete cargo install --quiet --locked --version "$CARGO_MACHETE_VERSION" cargo-machete
          run_bounded 540 install-typos cargo install --quiet --locked --version "$TYPOS_VERSION" typos-cli
          run_bounded 540 install-taplo cargo install --quiet --locked --version "$TAPLO_VERSION" taplo-cli
          run_bounded 30 machete-version cargo machete --version
          run_bounded 30 typos-version typos --version
          run_bounded 30 taplo-version taplo --version
          if [[ "$(< "$work/machete-version.log")" != "$CARGO_MACHETE_VERSION" ||
                "$(< "$work/typos-version.log")" != "typos-cli $TYPOS_VERSION" ||
                "$(< "$work/taplo-version.log")" != "taplo $TAPLO_VERSION" ]]; then
            printf 'hygiene: installed tool versions do not match the pins\n' >&2
            exit 1
          fi
          run_bounded 120 machete cargo machete
          run_bounded 120 typos typos
          run_bounded 120 taplo taplo fmt --check
      - name: Check generated spec bounds
        run: |
          python3 scripts/test-spec-bounds.py
          python3 scripts/spec-bounds.py

  changes:
    name: Detect code changes
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      code-changed: ${{ steps.diff.outputs.code-changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify code change detection
        run: python3 scripts/test-ci-changes.py
      - id: diff
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BEFORE: ${{ github.event.before }}
        run: python3 scripts/ci-changes.py

  format-and-clippy:
    name: ${{ matrix.os }} Clippy
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code-changed != 'false' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: ubuntu-24.04
          - os: macOS
            runner: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install repository Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - run: cargo fetch --locked
      - name: Check library dependency boundary
        if: runner.os == 'Linux'
        run: |
          cargo tree -p arany -e normal --target all --locked --offline > "$RUNNER_TEMP/arany-library-tree.txt"
          if grep -E 'ratatui|crossterm|keyring' "$RUNNER_TEMP/arany-library-tree.txt"; then
            exit 1
          fi
      - name: Check production release targets
        run: cargo clippy --workspace --lib --bins --release --locked --offline -- -D warnings -D clippy::unwrap_used
      - name: Check release targets with test fixtures
        run: cargo clippy --workspace --all-targets --release --features arany-cli/test-support --locked --offline -- -D warnings
      - name: Check release targets with all features
        if: runner.os == 'Linux'
        env:
          # Clear arany_ci only here to compile the ordinary release test alternatives.
          RUSTFLAGS: '-D warnings'
        run: cargo check --workspace --all-targets --all-features --release --locked --offline

  clippy:
    name: Clippy
    needs: [changes, format-and-clippy]
    if: ${{ always() && !cancelled() && needs.changes.outputs.code-changed != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require both native lint jobs to pass
        env:
          LINT_RESULT: ${{ needs.format-and-clippy.result }}
        run: test "$LINT_RESULT" = success

  linux-tests:
    name: Linux Tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code-changed != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-tests
      - name: Measure native long-history behavior
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.history_benchmark }}
        shell: bash
        run: |
          sudo apt-get install --yes tmux
          cargo test --locked --offline --release --features arany-cli/test-support -p arany-cli --test session_run active_terminal::tmux::history_latency::active_keyboard_stays_visible_with_near_cap_history -- --exact --ignored --nocapture | tee "$RUNNER_TEMP/arany-history-measurement.log"
          python3 - <<'PY'
          import os
          import pathlib
          import re

          output = (pathlib.Path(os.environ["RUNNER_TEMP"]) / "arany-history-measurement.log").read_text()
          if not re.search(r"test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; \d+ filtered out", output):
              raise SystemExit("The history measurement must complete exactly one test")
          PY

  macos-tests:
    name: macOS Tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code-changed != 'false' }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-tests
