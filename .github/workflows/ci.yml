name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      linux_arm64:
        description: Run native Linux ARM64 debug and release tests
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Enables the native gates marked `cfg_attr(not(arany_ci), ignore)`; one fingerprint for every job.
  RUSTFLAGS: --cfg arany_ci

jobs:
  changes:
    name: Detect Markdown-only PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      markdown-only: ${{ steps.diff.outputs.markdown-only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: diff
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          paths = subprocess.check_output([
              "git", "diff", "--no-renames", "--name-only", "-z", "HEAD^1", "HEAD",
          ]).split(b"\0")[:-1]
          markdown_only = bool(paths) and all(path.endswith(b".md") for path in paths)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"markdown-only={str(markdown_only).lower()}\n")
          PY

  format-and-clippy:
    name: Linux Format and Clippy
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - if: needs.changes.outputs.markdown-only != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install repository Rust toolchain
        if: needs.changes.outputs.markdown-only != 'true'
        run: rustup show
      - if: needs.changes.outputs.markdown-only != 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - if: needs.changes.outputs.markdown-only != 'true'
        run: cargo fmt --all --check
      - if: needs.changes.outputs.markdown-only != 'true'
        run: cargo fetch --locked
      - if: needs.changes.outputs.markdown-only != 'true'
        run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings

  tests:
    name: Linux Tests (${{ matrix.profile }})
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [debug, release]
    steps:
      - if: needs.changes.outputs.markdown-only != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install repository Rust toolchain
        if: needs.changes.outputs.markdown-only != 'true'
        run: rustup show
      - if: needs.changes.outputs.markdown-only != 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.profile }}
      - name: Prepare isolated Linux terminal fixtures
        if: needs.changes.outputs.markdown-only != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap util-linux
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-user --unshare-net --ro-bind / / -- true
      - if: needs.changes.outputs.markdown-only != 'true'
        run: cargo fetch --locked
      - if: needs.changes.outputs.markdown-only != 'true'
        run: cargo test --workspace --locked --offline ${{ matrix.profile == 'release' && '--release' || '' }}

  linux-arm64-tests:
    name: Linux ARM64 Tests (${{ matrix.profile }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.linux_arm64 }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [debug, release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install repository Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: linux-arm64-${{ matrix.profile }}
      - name: Verify native Linux ARM64 host and Rust target
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(rustc -vV | sed -n 's/^host: //p')" = aarch64-unknown-linux-gnu
      - name: Prepare isolated Linux terminal fixtures
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap util-linux
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-user --unshare-net --ro-bind / / -- true
      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked
      - name: Run workspace tests (${{ matrix.profile }})
        run: cargo test --workspace --locked --offline ${{ matrix.profile == 'release' && '--release' || '' }}

  macos-tests:
    name: macOS tests (${{ matrix.profile }})
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: macos-15
    timeout-minutes: 30
    env:
      TMPDIR: /private/tmp
      ARANY_TEST_EXE: ${{ github.workspace }}/target/${{ matrix.profile }}/arany
    strategy:
      fail-fast: false
      matrix:
        profile: [debug, release]
    steps:
      - if: needs.changes.outputs.markdown-only != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install repository Rust toolchain
        if: needs.changes.outputs.markdown-only != 'true'
        run: rustup show
      - if: needs.changes.outputs.markdown-only != 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.profile }}
      - if: needs.changes.outputs.markdown-only != 'true'
        run: cargo fetch --locked
      - name: Clippy on macOS
        if: matrix.profile == 'debug' && needs.changes.outputs.markdown-only != 'true'
        run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - if: needs.changes.outputs.markdown-only != 'true'
        run: cargo test --workspace --locked --offline ${{ matrix.profile == 'release' && '--release' || '' }}
