name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install repository Rust toolchain
        run: rustup show
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install repository Rust toolchain
        run: rustup show
      - run: cargo fetch --locked
      - run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings

  tests:
    name: Tests (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: debug
            cargo-flags: ""
          - profile: release
            cargo-flags: --release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install repository Rust toolchain
        run: rustup show
      - name: Prepare isolated Linux terminal fixtures
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap util-linux
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-user --unshare-net --ro-bind / / -- true
      - run: cargo fetch --locked
      - run: cargo test --workspace --locked --offline ${{ matrix.cargo-flags }}

  macos-tests:
    name: macOS tests (${{ matrix.profile }})
    runs-on: macos-15
    timeout-minutes: 30
    env:
      TMPDIR: /private/tmp
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: debug
            cargo-flags: ""
          - profile: release
            cargo-flags: --release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install repository Rust toolchain
        run: rustup show
      - run: cargo fetch --locked
      - run: cargo test --workspace --locked --offline ${{ matrix.cargo-flags }}
