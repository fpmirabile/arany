# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: assertive
  # Approve once every CodeRabbit comment is resolved; request changes otherwise.
  request_changes_workflow: true
  # Authors cannot bypass the gate with `@coderabbitai approve` or `resolve` on their own PRs.
  allow_author_approval: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
    # Never pause: the approval gate needs a review of the latest commit.
    auto_pause_after_reviewed_commits: 0
    base_branches:
      - main
      - chore/.*
  path_filters:
    - "!**/Cargo.lock"
    - "!.lavish/**"
    - "!planning/**"
  # agents/review.md owns the review practice; AGENTS.md and agents/*.md load through code_guidelines.
  path_instructions:
    - path: "**/*"
      instructions: Apply AGENTS.md and the "Highest-value checks" of agents/review.md.
    - path: "crates/arany/src/session/**"
      instructions: Apply the "Session and reducer" section of agents/review.md.
    - path: "crates/arany/src/engine/**"
      instructions: Apply the "Engine" section of agents/review.md.
    - path: "crates/arany/src/store/**"
      instructions: Apply the "Store" section of agents/review.md.
    - path: "crates/arany/src/{tools,private_fs}/**"
      instructions: Apply the "Tools and private files" section of agents/review.md.
    - path: "crates/arany/src/provider/**"
      instructions: Apply the "Provider" section of agents/review.md.
    - path: "crates/arany-cli/**"
      instructions: Apply the "Binary" section of agents/review.md.
    - path: "docs/specs/**"
      instructions: Apply the "Specs" section of agents/review.md.
    - path: "**/tests/**"
      instructions: Apply the "Tests" section of agents/review.md.
    - path: ".github/workflows/**"
      instructions: Apply the "Workflows" section of agents/review.md.
knowledge_base:
  code_guidelines:
    enabled: true
    # String entries apply only under their own directory, so guides outside the code use applyTo.
    filePatterns:
      - "AGENTS.md"
      - files: "agents/*.md,agents/references/**/*.md"
        applyTo: "**"
      - files: "agents/skills/rust-clean-code/**/*.md,agents/skills/clean-architecture-review/SKILL.md"
        applyTo: "crates/**/*.rs"
      - files: "agents/skills/terminal-ui-design/SKILL.md"
        applyTo: "crates/arany-cli/src/**/*.rs"
chat:
  auto_reply: true
