[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
]

[advisories]
unmaintained = "all"
unsound = "all"
ignore = [
  # zvariant, zbus_names and zvariant_derive are unmaintained with no safe upgrade; keyring 4.2 pulls them
  # through secret-service 5.2 / zbus 5.19. Revisit when keyring supports zbus 6 (released 2026-10-23).
  { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained; no safe upgrade until keyring adopts zbus 6" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained; no safe upgrade until keyring adopts zbus 6" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained; no safe upgrade until keyring adopts zbus 6" },
]

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[[licenses.exceptions]]
name = "option-ext"
version = "=0.2.0"
allow = ["MPL-2.0"]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
