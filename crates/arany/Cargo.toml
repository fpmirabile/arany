[package]
name = "arany"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true

[features]
test-support = ["dep:tempfile", "nix/fs", "nix/term", "tokio/test-util"]

[dependencies]
tempfile = { workspace = true, optional = true }
async-trait.workspace = true
aws-lc-rs.workspace = true
base64.workspace = true
cap-fs-ext.workspace = true
cap-std.workspace = true
directories.workspace = true
getrandom.workspace = true
opentelemetry.workspace = true
opentelemetry-http.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
rusqlite.workspace = true
reqwest.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
jsonschema.workspace = true
yaml_serde.workspace = true
unicode-segmentation.workspace = true
url.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true
nix.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
seccompiler.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation.workspace = true
security-framework.workspace = true

[dev-dependencies]
arany = { path = ".", features = ["test-support"] }
opentelemetry-proto.workspace = true
opentelemetry_sdk = { workspace = true, features = ["trace", "testing"] }
prost.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util", "io-util"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { workspace = true, features = ["pipe", "pty"] }

[target.'cfg(unix)'.dev-dependencies]
nix = { workspace = true, features = ["fs", "term"] }

[lints]
workspace = true
