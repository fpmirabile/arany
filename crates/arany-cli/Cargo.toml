[package]
name = "arany-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true

[[bin]]
name = "arany"
path = "src/main.rs"

[dependencies]
arany = { path = "../arany" }
async-trait.workspace = true
aws-lc-rs.workspace = true
base64.workspace = true
cap-fs-ext.workspace = true
cap-std.workspace = true
clap.workspace = true
crossterm.workspace = true
getrandom.workspace = true
keyring.workspace = true
ratatui.workspace = true
rusqlite.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true
url.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
mio.workspace = true
rustix.workspace = true
nix.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework.workspace = true

[dev-dependencies]
arany = { path = "../arany", features = ["test-support"] }
opentelemetry-proto.workspace = true
opentelemetry_sdk = { workspace = true, features = ["trace", "testing"] }
prost.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util", "io-util"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { workspace = true, features = ["pipe", "pty"] }

[target.'cfg(unix)'.dev-dependencies]
nix = { workspace = true, features = ["fs", "term"] }

[lints]
workspace = true
